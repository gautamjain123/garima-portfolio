<section #root id="top" class="hero" aria-labelledby="hero-title">
  <div class="hero__coords mono" aria-hidden="true">
    <span>28.6139° n, 77.2090° e</span>
    <span><span appPointerCoords>x 0.000 · y 0.000</span><span class="hero__caret"> _</span></span>
  </div>

  <figure class="hero__portrait">
    <span class="hero__sun hero__sun--big" aria-hidden="true"></span>
    <span class="hero__sun hero__sun--small" aria-hidden="true"></span>
    <figcaption class="hero__fig mono">fig. 01 — somewhere in the hills</figcaption>
    <div class="hero__photo" appColorLens #lens="colorLens" [origin]="[0.5, 0.36]">
      <span class="hero__hint" aria-hidden="true">{{ lens.full() ? hint.full : hint.mono }}</span>
      <div class="hero__layer">
        <div class="hero__photo-inner">
          <img class="hero__img" [src]="portrait" alt="Portrait of Garima Jain, smiling, with pine-covered hills behind her" fetchpriority="high" decoding="async" />
        </div>
      </div>
      <div class="hero__layer hero__layer--color" aria-hidden="true">
        <div class="hero__photo-inner">
          <img class="hero__img" [src]="portrait" alt="" decoding="async" />
        </div>
      </div>
      <span class="hero__corner hero__corner--tl" aria-hidden="true"></span>
      <span class="hero__corner hero__corner--br" aria-hidden="true"></span>
    </div>
  </figure>

  <h1 id="hero-title" class="hero__name" aria-label="Garima Jain">
    @for (word of nameWords; track $index; let last = $last) {
      <span class="hero__word" [class.hero__word--mark]="last" aria-hidden="true">
        @for (ch of word; track $index) {
          <span class="hero__char">{{ ch }}</span>
        }
      </span>
    }
  </h1>

  <div class="hero__meta">
    <p class="hero__role"><span>traveller &amp;</span>&nbsp;<span class="it">storyteller</span></p>
    <p class="hero__tags"><span class="t1">people</span> · <span class="t2">places</span> · <span class="t3">stories</span></p>
    <button type="button" class="hero__scroll" (click)="toPlaces()">see the places <span class="hero__scroll-arrow" aria-hidden="true">↓</span></button>
  </div>
</section>
