# Emails MailerLite subscribers when a new story is published (see scripts/notify-subscribers.mjs).
# Needs: secret MAILERLITE_API_KEY, and variable MAILERLITE_SENDER_EMAIL (MAILERLITE_SENDER_NAME and
# MAILERLITE_GROUP_NAME optional) under GitHub → Settings → Secrets and variables → Actions.
name: Email subscribers about new stories

on:
  push:
    branches: [main]
    paths: ['src/app/core/data/blog-posts.ts']
  workflow_dispatch:
    inputs:
      slug:
        description: Slug of the story to email (e.g. yakten-through-my-lens)
        required: true
      dry_run:
        description: Dry run (build the email, send nothing)
        type: boolean
        default: true

# One run at a time, so two quick pushes can't send the same story twice.
concurrency: notify-subscribers

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the previous commit to spot new stories
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Email new stories
        run: node scripts/notify-subscribers.mjs
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_SENDER_EMAIL: ${{ vars.MAILERLITE_SENDER_EMAIL }}
          MAILERLITE_SENDER_NAME: ${{ vars.MAILERLITE_SENDER_NAME }}
          MAILERLITE_GROUP_NAME: ${{ vars.MAILERLITE_GROUP_NAME }}
          BEFORE_SHA: ${{ github.event.before }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
